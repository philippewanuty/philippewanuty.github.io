<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 100 440 420" width="880" height="840" role="img" aria-label="Philippe Wanuty" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Philippe Wanuty</title>
  <defs>
    <g id="mark">
      <path pathLength="1" d="M218 246 L254 246.5 L355 417 L372 392.5 L386.5 419 L352 478 Z"/>
      <path pathLength="1" fill-rule="evenodd" d="M399 124 L479 260 L418.5 368 L465 448.5 L447 479 L319.5 259.5 Z M399 184 L354 260.5 L401 338 L446.5 262.5 Z"/>
      <path pathLength="1" d="M548.5 246.5 L585 246.5 L476.5 430 L458 398 Z"/>
    </g>
    <clipPath id="markClip"><use href="#mark"/></clipPath>
    <linearGradient id="scanGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .ch, .main, .flash { transform-box: fill-box; transform-origin: center; }
    .ch { opacity: 0; mix-blend-mode: screen; }

    /* ---- intro: draw + CRT power-on ---- */
    .main use {
      fill: #bababa; fill-opacity: 0;
      stroke: #f2f2f2; stroke-width: 3; stroke-linejoin: miter;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation:
        draw 1.5s cubic-bezier(.65,0,.25,1) forwards,
        fillOn .6s 1.5s step-end forwards,
        edge .8s 1.9s ease forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fillOn {
      0% { fill-opacity: 1; } 15% { fill-opacity: 0; } 30% { fill-opacity: .8; }
      45% { fill-opacity: .1; } 60%, 100% { fill-opacity: 1; }
    }
    @keyframes edge { to { stroke: #424242; } }

    /* ---- loop: 6s cycle of glitches, starts after intro ---- */
    .ch-r { animation: gR 6s 2.4s step-end infinite; }
    .ch-c { animation: gC 6s 2.4s step-end infinite; }
    .main { animation: gM 6s 2.4s step-end infinite; }
    .flash { opacity: 0; animation: fl 6s 2.4s step-end infinite; }
    .scan { opacity: 0; animation: scan 6s 2.4s linear infinite; }

    @keyframes gR {
      0%    { opacity: 0;  transform: none;                    clip-path: inset(0); }
      19%   { opacity: .9; transform: translate(-8px,1px);     clip-path: inset(6% 0 58% 0); }
      20%   { opacity: .9; transform: translate(6px,-2px);     clip-path: inset(42% 0 30% 0); }
      21%   { opacity: .9; transform: translate(-4px,0);       clip-path: inset(72% 0 4% 0); }
      22%   { opacity: 0;  transform: none;                    clip-path: inset(0); }
      54%   { opacity: .9; transform: translate(-12px,2px);    clip-path: inset(0 0 60% 0); }
      55.5% { opacity: .9; transform: translate(10px,-1px);    clip-path: inset(30% 0 35% 0); }
      57%   { opacity: .9; transform: translate(-6px,3px);     clip-path: inset(60% 0 10% 0); }
      58.5% { opacity: .9; transform: translate(14px,0);       clip-path: inset(15% 0 50% 0); }
      60%   { opacity: .9; transform: translate(-9px,-2px);    clip-path: inset(45% 0 20% 0); }
      61.5% { opacity: 0;  transform: none;                    clip-path: inset(0); }
      80%   { opacity: .9; transform: translate(5px,0);        clip-path: inset(20% 0 55% 0); }
      81%   { opacity: .9; transform: translate(-5px,1px);     clip-path: inset(65% 0 8% 0); }
      82%, 100% { opacity: 0; transform: none;                 clip-path: inset(0); }
    }
    @keyframes gC {
      0%    { opacity: 0;  transform: none;                    clip-path: inset(0); }
      19%   { opacity: .9; transform: translate(7px,-1px);     clip-path: inset(30% 0 45% 0); }
      20%   { opacity: .9; transform: translate(-6px,2px);     clip-path: inset(0 0 75% 0); }
      21%   { opacity: .9; transform: translate(5px,1px);      clip-path: inset(55% 0 15% 0); }
      22%   { opacity: 0;  transform: none;                    clip-path: inset(0); }
      54%   { opacity: .9; transform: translate(11px,-2px);    clip-path: inset(40% 0 25% 0); }
      55.5% { opacity: .9; transform: translate(-12px,1px);    clip-path: inset(5% 0 70% 0); }
      57%   { opacity: .9; transform: translate(8px,-3px);     clip-path: inset(25% 0 40% 0); }
      58.5% { opacity: .9; transform: translate(-10px,2px);    clip-path: inset(70% 0 5% 0); }
      60%   { opacity: .9; transform: translate(6px,1px);      clip-path: inset(10% 0 60% 0); }
      61.5% { opacity: 0;  transform: none;                    clip-path: inset(0); }
      80%   { opacity: .9; transform: translate(-6px,1px);     clip-path: inset(50% 0 25% 0); }
      81%   { opacity: .9; transform: translate(4px,-1px);     clip-path: inset(10% 0 70% 0); }
      82%, 100% { opacity: 0; transform: none;                 clip-path: inset(0); }
    }
    @keyframes gM {
      0%    { transform: none;                                  clip-path: inset(0); }
      19%   { transform: translate(4px,0) skewX(-4deg);         clip-path: inset(0 0 20% 0); }
      20%   { transform: translate(-3px,1px);                   clip-path: inset(15% 0 0 0); }
      21%   { transform: translate(1px,-1px) skewX(3deg);       clip-path: inset(0); }
      22%   { transform: none;                                  clip-path: inset(0); }
      54%   { transform: translate(-6px,3px) skewX(5deg);       clip-path: inset(0 0 12% 0); }
      55.5% { transform: translate(7px,-2px);                   clip-path: inset(18% 0 0 0); }
      57%   { transform: translate(-4px,-3px) skewX(-6deg);     clip-path: inset(0); }
      58.5% { transform: translate(5px,2px);                    clip-path: inset(0 0 30% 0); }
      60%   { transform: translate(-3px,1px) skewX(3deg);       clip-path: inset(8% 0 0 0); }
      61.5% { transform: none;                                  clip-path: inset(0); }
      80%   { transform: translate(-3px,0) skewX(2deg);         clip-path: inset(0 0 10% 0); }
      81%   { transform: translate(2px,1px);                    clip-path: inset(0); }
      82%, 100% { transform: none;                              clip-path: inset(0); }
    }
    @keyframes fl {
      0% { opacity: 0; } 54% { opacity: .85; } 55% { opacity: 0; }
      58.5% { opacity: .4; } 59.2% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes scan {
      0%   { opacity: 0;  transform: translateY(0); }
      66%  { opacity: 0;  transform: translateY(0); }
      70%  { opacity: .7; transform: translateY(40px); }
      96%  { opacity: .5; transform: translateY(360px); }
      100% { opacity: 0;  transform: translateY(380px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .main use { animation: none; fill-opacity: 1; stroke: #424242; stroke-dashoffset: 0; }
      .ch, .main, .flash, .scan { animation: none; }
    }
  </style>

  <g class="ch ch-r"><use href="#mark" fill="#ff2a4d"/></g>
  <g class="ch ch-c"><use href="#mark" fill="#1fe3ff"/></g>
  <g class="main"><use href="#mark"/></g>
  <g class="flash"><use href="#mark" fill="#ffffff"/></g>
  <g clip-path="url(#markClip)">
    <rect class="scan" x="200" y="118" width="400" height="3" fill="url(#scanGrad)"/>
  </g>
</svg>
