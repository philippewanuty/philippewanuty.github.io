<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Philippe Wanuty Studio</title>
<meta name="description" content="Philippe Wanuty Studio — criação de games e apps inteligentes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --silver:#bababa;
    --edge:#424242;
    --text:#d6d6d6;
    --dim:#7a7a7a;
    --red:#ff2a4d;
    --cyan:#1fe3ff;
    --pixel:'Press Start 2P', 'Courier New', monospace;
    --crt:'VT323', 'Courier New', ui-monospace, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--crt);
    overflow:hidden;display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  }

  /* ---------- CRT layers ---------- */
  #noise{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.05;pointer-events:none;z-index:1}
  .crt{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:
      repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%);
  }

  /* ---------- language switch ---------- */
  .lang{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);right:calc(env(safe-area-inset-right,0px) + 18px);display:flex;gap:10px;z-index:10}
  .lang button{
    width:36px;height:24px;padding:0;border:1px solid var(--edge);background:none;cursor:pointer;
    filter:grayscale(1) brightness(.7);opacity:.55;transition:filter .2s, opacity .2s, border-color .2s;
  }
  .lang button svg{display:block;width:100%;height:100%}
  .lang button:hover{opacity:.9}
  .lang button[aria-pressed="true"]{filter:none;opacity:1;border-color:var(--silver)}
  .lang button:focus-visible,.mail:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

  /* ---------- main ---------- */
  main{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px}

  .logo{position:relative;width:min(280px,58vw);aspect-ratio:400/390;cursor:pointer;margin-bottom:clamp(22px,4vh,40px)}
  .logo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .logo .ch{opacity:0;mix-blend-mode:screen}

  .logo .main use{
    fill:var(--silver);fill-opacity:0;
    stroke:#f2f2f2;stroke-width:3;stroke-linejoin:miter;
    stroke-dasharray:1;stroke-dashoffset:1;
  }
  .logo.draw .main use{animation:draw 1.5s cubic-bezier(.65,0,.25,1) forwards}
  .logo.filled .main use{animation:draw 0s forwards, fillIn .6s steps(1) forwards, edge .8s .4s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fillIn{0%{fill-opacity:1}15%{fill-opacity:0}30%{fill-opacity:.8}45%{fill-opacity:.1}60%,100%{fill-opacity:1}}
  @keyframes edge{to{stroke:var(--edge)}}

  /* scan line passing over the mark */
  .logo .scan{position:absolute;left:-6%;right:-6%;height:2px;top:0;opacity:0;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
  .logo.filled .scan{animation:scan 4.5s 1s linear infinite}
  @keyframes scan{0%{top:0;opacity:0}8%{opacity:.7}85%{opacity:.5}100%{top:100%;opacity:0}}

  /* small glitch */
  .logo.glitch .ch{opacity:.9}
  .logo.glitch .ch-r{animation:gR .16s steps(1) infinite}
  .logo.glitch .ch-c{animation:gC .2s steps(1) infinite}
  .logo.glitch .main{animation:gM .18s steps(1) infinite}
  @keyframes gR{
    0%{transform:translate(-8px,1px);clip-path:inset(6% 0 58% 0)}
    33%{transform:translate(6px,-2px);clip-path:inset(42% 0 30% 0)}
    66%{transform:translate(-4px,0);clip-path:inset(72% 0 4% 0)}
  }
  @keyframes gC{
    0%{transform:translate(7px,-1px);clip-path:inset(30% 0 45% 0)}
    33%{transform:translate(-6px,2px);clip-path:inset(0 0 75% 0)}
    66%{transform:translate(5px,1px);clip-path:inset(55% 0 15% 0)}
  }
  @keyframes gM{
    0%{transform:translate(0,0);clip-path:inset(0)}
    25%{transform:translate(4px,0) skewX(-4deg);clip-path:inset(0 0 20% 0)}
    50%{transform:translate(-3px,1px);clip-path:inset(15% 0 0 0)}
    75%{transform:translate(1px,-1px) skewX(3deg);clip-path:inset(0)}
  }

  /* text */
  h1{font-family:var(--pixel);font-weight:400;font-size:clamp(11px,2.3vw,20px);letter-spacing:.06em;line-height:1.6;color:var(--text);min-height:1.6em}
  .tag{font-size:clamp(19px,2.6vw,26px);color:var(--dim);margin-top:10px;min-height:1.2em}
  .tag::after{content:"_";margin-left:2px;animation:blink 1s steps(1) infinite;color:var(--silver)}
  @keyframes blink{50%{opacity:0}}

  .mail{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    z-index:3;font-size:clamp(18px,2.2vw,22px);color:var(--dim);text-decoration:none;letter-spacing:.04em;white-space:nowrap}
  .mail:hover{color:var(--text);text-shadow:-2px 0 var(--red),2px 0 var(--cyan)}

  .hidden{opacity:0}
  .show{opacity:1;transition:opacity .3s}

  /* pane message */
  .pane-msg{position:absolute;top:-38px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-family:var(--pixel);font-size:clamp(8px,1.4vw,11px);color:var(--red);opacity:0;pointer-events:none;letter-spacing:.05em}

  /* big "pane" */
  body.pane main{animation:shake .1s steps(2) infinite}
  body.pane .pane-msg{opacity:1;animation:blink .25s steps(1) infinite}
  body.pane .logo{filter:contrast(1.4)}
  body.pane h1,body.pane .tag{text-shadow:-3px 0 var(--red),3px 0 var(--cyan)}
  html.flash{filter:invert(1)}
  @keyframes shake{
    0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}
    50%{transform:translate(4px,-1px)}75%{transform:translate(-2px,-2px)}
  }

  /* ---------- boot terminal ---------- */
  #boot{position:fixed;inset:0;z-index:20;background:var(--bg);
    padding:calc(env(safe-area-inset-top,0px) + 28px) 24px;font-size:clamp(17px,2.2vw,22px);color:var(--silver);
    line-height:1.35;transition:opacity .35s;cursor:pointer}
  #boot .err{color:var(--red)}
  #boot .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);right:24px;color:var(--dim);font-size:16px}
  #boot.out{opacity:0}

  @media (prefers-reduced-motion: reduce){
    .logo .scan, .tag::after{animation:none!important}
    body.pane main{animation:none}
  }
</style>
</head>
<body>

<canvas id="noise" aria-hidden="true"></canvas>
<div class="crt" aria-hidden="true"></div>

<!-- the mark, defined once -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="mark">
      <path pathLength="1" d="M218 246 L254 246.5 L355 417 L372 392.5 L386.5 419 L352 478 Z"/>
      <path pathLength="1" fill-rule="evenodd" d="M399 124 L479 260 L418.5 368 L465 448.5 L447 479 L319.5 259.5 Z M399 184 L354 260.5 L401 338 L446.5 262.5 Z"/>
      <path pathLength="1" d="M548.5 246.5 L585 246.5 L476.5 430 L458 398 Z"/>
    </g>
  </defs>
</svg>

<nav class="lang" aria-label="Idioma / Language">
  <button type="button" data-lang="en" aria-label="English" aria-pressed="false">
    <svg viewBox="0 0 30 20" aria-hidden="true">
      <rect width="30" height="20" fill="#b22234"/>
      <g fill="#fff">
        <rect y="1.54" width="30" height="1.54"/><rect y="4.62" width="30" height="1.54"/>
        <rect y="7.69" width="30" height="1.54"/><rect y="10.77" width="30" height="1.54"/>
        <rect y="13.85" width="30" height="1.54"/><rect y="16.92" width="30" height="1.54"/>
      </g>
      <rect width="12" height="10.77" fill="#3c3b6e"/>
      <g fill="#fff">
        <circle cx="2" cy="2" r=".5"/><circle cx="5" cy="2" r=".5"/><circle cx="8" cy="2" r=".5"/><circle cx="11" cy="2" r=".5"/>
        <circle cx="3.5" cy="4.5" r=".5"/><circle cx="6.5" cy="4.5" r=".5"/><circle cx="9.5" cy="4.5" r=".5"/>
        <circle cx="2" cy="7" r=".5"/><circle cx="5" cy="7" r=".5"/><circle cx="8" cy="7" r=".5"/><circle cx="11" cy="7" r=".5"/>
        <circle cx="3.5" cy="9.4" r=".5"/><circle cx="6.5" cy="9.4" r=".5"/><circle cx="9.5" cy="9.4" r=".5"/>
      </g>
    </svg>
  </button>
  <button type="button" data-lang="pt" aria-label="Português" aria-pressed="false">
    <svg viewBox="0 0 30 20" aria-hidden="true">
      <rect width="30" height="20" fill="#009c3b"/>
      <polygon points="15,2 28,10 15,18 2,10" fill="#ffdf00"/>
      <circle cx="15" cy="10" r="4.6" fill="#002776"/>
      <path d="M10.5 9.2 Q15 7.7 19.5 10.8" stroke="#fff" stroke-width="0.9" fill="none"/>
    </svg>
  </button>
</nav>

<main>
  <div class="logo" id="logo" role="img" aria-label="Logo Philippe Wanuty">
    <div class="pane-msg" id="paneMsg"></div>
    <svg class="ch ch-r" viewBox="200 110 400 390" aria-hidden="true"><use href="#mark" fill="#ff2a4d"/></svg>
    <svg class="ch ch-c" viewBox="200 110 400 390" aria-hidden="true"><use href="#mark" fill="#1fe3ff"/></svg>
    <svg class="main" viewBox="200 110 400 390" aria-hidden="true"><use href="#mark"/></svg>
    <div class="scan" aria-hidden="true"></div>
  </div>

  <h1 id="title" class="hidden">PHILIPPE WANUTY STUDIO</h1>
  <p class="tag hidden" id="tag" data-i18n="tag"></p>
</main>

<a class="mail hidden" id="mail" href="mailto:contact@philippewanuty.com">contact@philippewanuty.com</a>

<div id="boot" aria-hidden="true"><div id="bootLines"></div><div class="hint" id="bootHint"></div></div>

<script>
(() => {
  const T = {
    pt: {
      tag: "Criação de games e apps inteligentes",
      hint: "clique para pular",
      pane: "!! PANE NO SISTEMA !!",
      recover: "recuperando...",
      boot: [
        "> iniciando pw_studio.exe",
        "> carregando módulos de IA .......... OK",
        "> compilando sprites ................ OK",
        "> ERRO 0x0F4: pane no núcleo gráfico",
        "> reiniciando ...",
        "> acesso liberado"
      ]
    },
    en: {
      tag: "Games and smart apps, built from scratch",
      hint: "click to skip",
      pane: "!! SYSTEM FAILURE !!",
      recover: "recovering...",
      boot: [
        "> starting pw_studio.exe",
        "> loading AI modules ............... OK",
        "> compiling sprites ................ OK",
        "> ERROR 0x0F4: graphics core failure",
        "> rebooting ...",
        "> access granted"
      ]
    }
  };

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = id => document.getElementById(id);
  const logo = $("logo"), title = $("title"), tag = $("tag"), mail = $("mail"), paneMsg = $("paneMsg");
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- language ---------- */
  let lang;
  try { lang = localStorage.getItem("pw-lang"); } catch(e) {}
  if (!T[lang]) lang = (navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en";

  function markFlags(){
    document.querySelectorAll(".lang button").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));
    document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  }
  markFlags();

  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem("pw-lang", lang); } catch(e) {}
    markFlags();
    minorGlitch();
    reduce ? (tag.textContent = T[lang].tag) : scramble(tag, T[lang].tag);
  }));

  /* ---------- text decode effect ---------- */
  const GLYPHS = "!<>-_\\/[]{}=+*^?#01░▒▓";
  function scramble(el, text){
    const old = el.textContent, len = Math.max(old.length, text.length), q = [];
    for (let i = 0; i < len; i++){
      const s = Math.random() * 18 | 0;
      q.push({ from: old[i] || "", to: text[i] || "", s, e: s + 8 + (Math.random() * 22 | 0) });
    }
    let f = 0; cancelAnimationFrame(el._raf);
    const tick = () => {
      let out = "", done = 0;
      for (const c of q){
        if (f >= c.e){ out += c.to; done++; }
        else if (f >= c.s) out += GLYPHS[Math.random() * GLYPHS.length | 0];
        else out += c.from;
      }
      el.textContent = out;
      if (done < q.length){ f++; el._raf = requestAnimationFrame(tick); }
    };
    tick();
  }

  /* ---------- noise ---------- */
  const cv = $("noise"), ctx = cv.getContext("2d");
  cv.width = 160; cv.height = 100;
  const img = ctx.createImageData(160, 100);
  function noise(){
    const d = img.data;
    for (let i = 0; i < d.length; i += 4){ const v = Math.random() * 255 | 0; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
    ctx.putImageData(img, 0, 0);
  }
  noise();
  if (!reduce) setInterval(noise, 70);
  const setNoise = v => cv.style.opacity = v;

  /* ---------- glitches ---------- */
  function minorGlitch(){
    if (reduce) return;
    logo.classList.add("glitch");
    setTimeout(() => logo.classList.remove("glitch"), 110 + Math.random() * 240);
  }
  function flash(ms = 70){
    if (reduce) return;
    document.documentElement.classList.add("flash");
    setTimeout(() => document.documentElement.classList.remove("flash"), ms);
  }
  function pane(){
    if (reduce || document.body.classList.contains("pane")) return;
    flash();
    document.body.classList.add("pane");
    logo.classList.add("glitch");
    paneMsg.textContent = T[lang].pane;
    setNoise(.3);
    setTimeout(() => paneMsg.textContent = T[lang].recover, 650);
    setTimeout(() => {
      document.body.classList.remove("pane");
      logo.classList.remove("glitch");
      setNoise(.05);
      scramble(title, "PHILIPPE WANUTY STUDIO");
    }, 1150);
  }
  function idle(){
    setTimeout(() => { Math.random() < .16 ? pane() : minorGlitch(); idle(); }, 2200 + Math.random() * 4200);
  }
  logo.addEventListener("click", pane);

  /* ---------- reveal ---------- */
  async function reveal(){
    tag.textContent = "";
    if (reduce){
      logo.classList.add("filled");
      tag.textContent = T[lang].tag;
      [title, tag, mail].forEach(e => e.classList.replace("hidden", "show"));
      return;
    }
    logo.classList.add("draw");
    await sleep(1500);
    flash(50);
    logo.classList.add("filled");
    minorGlitch();
    title.classList.replace("hidden", "show");
    title.textContent = "";
    scramble(title, "PHILIPPE WANUTY STUDIO");
    await sleep(450);
    tag.classList.replace("hidden", "show");
    scramble(tag, T[lang].tag);
    await sleep(600);
    mail.classList.replace("hidden", "show");
    idle();
  }

  /* ---------- boot sequence ---------- */
  async function boot(){
    const box = $("boot"), lines = $("bootLines");
    if (reduce){ box.remove(); reveal(); return; }
    let skip = false;
    const doSkip = () => skip = true;
    box.addEventListener("click", doSkip);
    addEventListener("keydown", doSkip, { once: true });
    $("bootHint").textContent = T[lang].hint;

    for (const l of T[lang].boot){
      if (skip) break;
      const row = document.createElement("div");
      const err = /0x0F4/.test(l);
      if (err) row.className = "err";
      lines.appendChild(row);
      for (const ch of l){ if (skip) break; row.textContent += ch; await sleep(11); }
      if (err){ flash(60); setNoise(.25); await sleep(380); setNoise(.05); }
      else await sleep(110);
    }
    box.classList.add("out");
    await sleep(350);
    box.remove();
    reveal();
  }

  boot();
})();
</script>
</body>
</html>
